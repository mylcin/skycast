# Git hooks. Installed by `npx lefthook install` (run automatically by npm install).
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{ts,js,mjs,json,md,yml,yaml}'
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,js,mjs}'
      run: npx eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
